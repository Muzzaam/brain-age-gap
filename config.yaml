# Central configuration. Edit here rather than in code.
# Every script reads this file; command-line flags only override it.

data:
  source: synthetic          # switch to "aric" when the real data arrives
  aric:
    # ARIC-NCS visit 5 variables (csv, sas7bdat, dta, sav, parquet). One file, or a list
    # of files joined on participant id, the first being one row per participant:
    #   tabular_path: [data/raw/v5.sas7bdat, data/raw/ncs.sas7bdat, data/raw/dementia.sas7bdat]
    tabular_path: data/raw/aric_ncs.csv
    brain_age_path: data/raw/brain_age.csv   # participant_id, brain_age (output of the imaging step)
    scan_id_map_path: null                   # optional CSV (scan_id, participant_id) if scan names are not ARIC ids
  synthetic:
    n: 1900                  # roughly the size of the ARIC-NCS MRI subsample
    seed: 42
    target_signal_fraction: 0.30   # ~upper bound on recoverable BAG R^2 from biomarkers (clean)
    cell_missing_rate: 0.05
    group_missing_rate: 0.02
    outlier_rate: 0.003
    prevalent_dementia_rate: 0.04
    bag_missing_rate: 0.02         # scans that failed brain-age QC
    outcome_missing_rate: 0.03     # missing cognitive score / dementia follow-up
    max_followup_years: 10.0

features:
  # Included in EVERY model (RQ1 baselines and all four RQ2 conditions), so that
  # nothing can look useful just by standing in for age, sex or scanner site.
  covariates: [age, sex, site]

cv:
  outer_folds: 5             # nested CV: outer folds give the reported mean +/- SD
  repeats: 3                 # outer CV repeated with different shuffles (5 x 3 = 15 estimates)
  inner_folds: 3             # inner CV: hyperparameter tuning and stage-1 cross-fitting
  seed: 42

models:
  rq1: [ridge, elastic_net, xgboost, mlp]
  stage1: auto               # BAG estimator for RQ2; "auto" = best inner-CV R2 within each fold
  stage2_cognitive: [ridge, elastic_net, xgboost, mlp]
  stage2_dementia: [cox, survival_gbm]
  shap: [ridge, xgboost, mlp]
  # RQ3: how BAG enters a neural downstream model (src/models/framings.py)
  rq3_framings: [baseline, two_stage, multitask, multitask_placebo, bottleneck, transfer]

neural:
  # One network for every RQ3 framing: 2 hidden layers within the proposal's 64-128
  # range, ReLU + dropout, Adam, early stopping on a 15% validation split.
  # weight decay (and the BAG loss weight, for multitask/bottleneck) are tuned by inner CV.
  hidden: [128, 64]
  dropout: 0.2
  lr: 0.003
  max_epochs: 1000
  patience: 30
  finetune_lr_factor: 0.1    # transfer framing: encoder learning rate during fine-tuning

bias_correction:
  # Every analysis is run once per variant and both are reported (sensitivity analysis).
  variants: [uncorrected, corrected]
  # Correction is fitted on training participants with reference_column == 1
  # (e.g. cognitively normal). If the column is absent, all training participants are used.
  reference_column: healthy_reference

evaluation:
  bag_r2_threshold: 0.20     # pre-registered "meaningful fidelity" threshold (mean outer-fold R2)
  alpha: 0.05

reporting:
  results_dir: results
  min_cell_size: 10          # counts below this are suppressed in saved outputs
  extra_subgroup_columns: [race]   # reported in the subgroup breakdown if present in the data
  shap_max_explain: 200      # test rows explained per fold for the (slow) model-agnostic explainer
